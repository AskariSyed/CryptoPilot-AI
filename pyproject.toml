[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptopilot-ai"
version = "0.1.0-alpha.0"
description = "Autonomous, modular cryptocurrency spot trading agent with quantitative risk management"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "CryptoPilot Engineering Team" }]
license = { text = "MIT" }
dependencies = [
    "ccxt>=4.4.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "SQLAlchemy[asyncio]>=2.0.30",
    "greenlet>=3.1.0",
    "alembic>=1.14.0",
    "aiosqlite>=0.21.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-dotenv>=1.0.1",
    "aiohttp>=3.10.0",
    "scikit-learn>=1.6.0",
    "xgboost>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "hypothesis>=6.120.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pandas-stubs>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ccxt.*", "sklearn.*", "joblib.*", "xgboost.*", "transformers.*"]
ignore_missing_imports = true
