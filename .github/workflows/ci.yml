name: CI - Test & Quality Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Static Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Tooling Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pandas-stubs pydantic-settings ccxt sqlalchemy

      - name: Run Ruff Lint Check
        run: ruff check src tests

      - name: Run Ruff Formatting Check
        run: ruff format --check src tests

      - name: Run MyPy Static Type Check
        run: mypy src

  test-suite:
    name: Pytest & Coverage (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Test Suite with Coverage
        run: |
          pytest --cov=cryptopilot --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
